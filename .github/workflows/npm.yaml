# Builds an npm repo on each push to main and, when the commits since the last release hold a feat or fix, releases it:
# the version is bumped (see version/next), committed and tagged, then what the package declares decides what it releases:
# - a verify script in package.json runs first (npm run verify); a container repo has none;
# - a Dockerfile means an image, built by scripts/build-image.sh and pushed to ghcr.io as the repo's name less -container;
# - "private": true means nothing is published to GitHub Packages and nothing attached to the GitHub release; otherwise
#   the package is published and its .tgz attached (a workspace root is private by npm's rule, so it decides per workspace).
# So a web app with a Dockerfile verifies, builds its image from its own build and pushes it in one release; an old container
# repo (private, no verify) only builds and pushes its image. A release that names its container-repository pins the new
# version there, which releases the image in turn. A repo whose root package.json has workspaces releases them together:
# the root and every workspace take the one version, a workspace's range on another becomes ^<version>, and each workspace
# is published and attached (container-repository is not supported there).
name: npm

on:
  workflow_call:
    inputs:
      container-repository:
        description: 'The repo packaging this one into an image, e.g. okayat-web-container; kept only until the web repos have released without it'
        type: string
        default: ''
      node-version:
        type: string
        default: '22'
    secrets:
      WORKFLOW_TOKEN:
        description: 'A PAT with repo and write:packages scopes'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04

    concurrency:
      # a newer push to a branch supersedes the build of an older one; main is never cancelled, as it may be mid-release
      # (a build it queues behind finds the commits since the last release anyway, see version/next)
      group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    permissions:
      contents: read
      packages: write

    env:
      # the repos' .npmrc authenticates npm.pkg.github.com with this
      NODE_AUTH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
          cache: npm

      - name: Describe project
        id: project
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "${GITHUB_OUTPUT}"
          echo "name=$(node -p "require('./package.json').name")" >> "${GITHUB_OUTPUT}"
          echo "workspaces=$(node -p "(require('./package.json').workspaces ?? []).length > 0")" >> "${GITHUB_OUTPUT}"
          # a workspace root is private by npm's rule; its workspaces publish (npm skips any marked private)
          echo "publish=$(node -p "const p = require('./package.json'); (p.workspaces ?? []).length > 0 || p.private !== true")" >> "${GITHUB_OUTPUT}"
          echo "verify=$(node -p "typeof require('./package.json').scripts?.verify === 'string'")" >> "${GITHUB_OUTPUT}"
          if [[ -f Dockerfile ]]
          then
            repository="${{ github.event.repository.name }}"
            echo "image=${repository%-container}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Next version
        id: next
        uses: nickersan/actions/version/next@main
        with:
          declared-version: ${{ steps.project.outputs.version }}

      # only main releases: a build of any other branch, e.g. Renovate's, is a check
      - name: Release or check
        id: plan
        env:
          BUMP: ${{ steps.next.outputs.bump }}
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/main ]]
          then
            echo "::notice::${GITHUB_REF_NAME} is a branch - checks only, no release"
          elif [[ "${BUMP}" != none ]]
          then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set version ${{ steps.next.outputs.version }}
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          WORKSPACES: ${{ steps.project.outputs.workspaces }}
        run: |
          if [[ "${WORKSPACES}" != true ]]
          then
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
            exit 0
          fi
          npm version "${VERSION}" --no-git-tag-version --allow-same-version --workspaces --include-workspace-root --no-workspaces-update
          # npm leaves a workspace's range on another as it was, which the new version no longer satisfies
          node -e '
            const fs = require("fs"), { execSync } = require("child_process");
            const version = process.argv[1];
            const workspaces = JSON.parse(execSync("npm query .workspace", { encoding: "utf8" }));
            const names = new Set(workspaces.map((w) => w.name));
            for (const w of workspaces)
            {
              const file = `${w.location}/package.json`;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              for (const field of ["dependencies", "peerDependencies", "devDependencies", "optionalDependencies"])
                for (const name of Object.keys(pkg[field] ?? {})) if (names.has(name)) pkg[field][name] = `^${version}`;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }' "${VERSION}"
          npm install --package-lock-only --ignore-scripts

      - name: Install
        run: npm ci

      - name: Build
        env:
          VERIFY: ${{ steps.project.outputs.verify }}
        run: |
          if [[ "${VERIFY}" == true ]]
          then
            npm run verify
          fi
          if [[ -f Dockerfile ]]
          then
            bash scripts/build-image.sh
          fi

      - name: Push release
        id: release
        if: steps.plan.outputs.release == 'true'
        uses: nickersan/actions/release/push@main
        with:
          version: ${{ steps.next.outputs.version }}

      # verify has already run, so prepublishOnly needn't run it again; a private package publishes nothing
      - name: Publish
        if: steps.release.outputs.pushed == 'true' && steps.project.outputs.publish == 'true'
        env:
          WORKSPACES: ${{ steps.project.outputs.workspaces }}
        run: |
          if [[ "${WORKSPACES}" == true ]]
          then
            npm publish --workspaces --ignore-scripts
            npm pack --workspaces --ignore-scripts
          else
            npm publish --ignore-scripts
            npm pack --ignore-scripts
          fi

      - name: Push image
        if: steps.release.outputs.pushed == 'true' && steps.project.outputs.image != ''
        uses: nickersan/actions/image/push@main
        with:
          image: ${{ steps.project.outputs.image }}
          version: ${{ steps.next.outputs.version }}
          token: ${{ github.token }}

      - name: Create GitHub release
        if: steps.release.outputs.pushed == 'true'
        run: |
          shopt -s nullglob
          gh release create "v${{ steps.next.outputs.version }}" --verify-tag --generate-notes -- *.tgz

      - name: Update ${{ inputs.container-repository }}
        if: steps.release.outputs.pushed == 'true' && inputs.container-repository != ''
        uses: nickersan/actions/release/update-container@main
        with:
          repository: ${{ inputs.container-repository }}
          artifact: ${{ steps.project.outputs.name }}
          version: ${{ steps.next.outputs.version }}
          bump: ${{ steps.next.outputs.bump }}
          update: >-
            npm pkg set "dependencies.${{ steps.project.outputs.name }}=${VERSION}"
            && npm install --package-lock-only --ignore-scripts
          token: ${{ secrets.WORKFLOW_TOKEN }}
